troke-dasharray="6 5"/><polygon points="42,115 88,115 75,50 53,75" fill="#0879c9"/><polygon points="178,115 132,115 145,50 167,75" fill="#e56a16"/><path d="M88 115H132 M75 50H145" stroke="#647b94" stroke-dasharray="3 5" fill="none"/><text x="113" y="14" font-size="10" fill="#243d57">Eje</text>`;legend+=' · Línea discontinua: eje de reflexión';break;case 3:shape=`<rect x="50" y="45" width="120" height="78" fill="#0879c9" fill-opacity=".22" stroke="#0879c9" stroke-width="3"/><path d="M110 18V152M20 84H200" stroke="#243d57" stroke-width="2" stroke-dasharray="6 5"/>`;legend='Rectángulo no cuadrado · Líneas discontinuas: ejes de simetría';break;case 4:shape=grid+`<rect x="38" y="121" width="18" height="14" fill="#0879c9"/><rect x="74" y="106.6" width="18" height="14" fill="#e56a16"/><path d="M47 128L83 113.6" stroke="#243d57" stroke-width="2" marker-end="url(#arrow)"/>`;legend+=' · Dos columnas a la derecha y una fila arriba';break;case 5:shape=`<circle cx="110" cy="90" r="4" fill="#243d57"/><path d="M110 90V35" stroke="#0879c9" stroke-width="8" marker-end="url(#blueArrow)"/><path d="M110 90V145" stroke="#e56a16" stroke-width="8" marker-end="url(#orangeArrow)"/><path d="M150 57A50 50 0 0 1 150 123" fill="none" stroke="#243d57" stroke-width="2.5" marker-end="url(#arrow)"/>`;legend+=' · Media vuelta alrededor del centro';break;case 7:shape=`<polygon points="110,36 166,126 54,126" fill="#0879c9" fill-opacity=".22" stroke="#0879c9" stroke-width="3"/><path d="M110 20V145" stroke="#243d57" stroke-width="2.5" stroke-dasharray="6 5"/>`;legend='Triángulo isósceles · Línea discontinua: posible eje de simetría';break;}return `<div class="diagram"><svg viewBox="0 0 220 180" width="390" height="320" role="img" aria-label="${esc(q.q)}"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#243d57"/></marker><marker id="blueArrow" markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#0879c9"/></marker><marker id="orangeArrow" markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#e56a16"/></marker></defs>${shape}</svg><span class="small">${legend}</span></div>`}return ''}
function showQuestion(){selected='';checked=false;let q=current(),list=questions.filter(q=>q.b===block),total=mode==='expert'?1:list.length;app.innerHTML=`<div class="crumb">${mode==='expert'?'Reto experto':'Mundo '+(block+1)} · ${esc(blocks[block][0])}</div><div class="panel"><div class="small">${mode==='expert'?'DESAFÍO ESPECIAL':`PREGUNTA ${idx+1} DE ${total}`}</div>${bar(idx+1,total)}<div class="question">${esc(q.q)}</div>${diagram(q)}<div id="answerArea">${q.opts?`<div class="options">${q.opts.map(o=>`<button class="opt" onclick="choose(this,${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}</div>`:`<input id="answer" class="answer" autocomplete="off" inputmode="decimal" placeholder="Escribe tu respuesta" onkeydown="if(event.key==='Enter')check()">`}</div><div id="feedback"></div><div id="actions"><button class="btn" onclick="check()">Comprobar respuesta</button><button class="btn secondary" onclick="home()">Volver al mapa</button></div></div>`}
function choose(el,v){selected=v;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function check(){if(checked)return;let q=current(),v=q.opts?selected:document.getElementById('answer').value;if(!String(v).trim()){alert('Escribe o selecciona una respuesta.');return}let ok=normalize(v)===normalize(q.a);checked=true;if(mode==='block'&&ok){let qi=questions.indexOf(q);progress.done[qi]=true;save()}if(mode==='expert'&&ok){progress.expert[block]=true;save()}document.getElementById('answerArea').querySelectorAll('input,button').forEach(e=>e.disabled=true);document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><strong>${ok?'✓ ¡Correcto!':'↻ Sigue practicando'}</strong><div>Respuesta: <strong>${esc(q.a)}</strong></div><div>${esc(q.why)}</div></div>`;let total=mode==='expert'?1:questions.filter(q=>q.b===block).length;document.getElementById('actions').innerHTML=`<button class="btn" onclick="${mode==='expert'||idx+1===total?'home()':'next()'}">${mode==='expert'||idx+1===total?'Volver al mapa':'Siguiente pregunta →'}</button><button class="btn secondary" onclick="showQuestion()">Repetir pregunta</button>`}
function next(){idx++;showQuestion()}
function startExam(){mode='exam';examAnswers={};let by=blocks.map((b,i)=>questions.filter(q=>q.b===i));examSet=[];let quotas=[3,3,3,2,2,2,3];by.forEach((arr,i)=>{let copy=[...arr];for(let j=copy.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[copy[j],copy[k]]=[copy[k],copy[j]]};examSet.push(...copy.slice(0,quotas[i]))});for(let j=examSet.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[examSet[j],examSet[k]]=[examSet[k],examSet[j]]}idx=0;showExam()}
function showExam(){let q=examSet[idx];app.innerHTML=`<div class="crumb">Simulacro final · Pregunta ${idx+1} de 18</div><div class="panel">${bar(idx+1,18)}<div class="question">${esc(q.q)}</div>${diagram(q)}${q.opts?`<div class="options">${q.opts.map(o=>`<button class="opt ${examAnswers[idx]===o?'selected':''}" onclick="examChoose(this,${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join('')}</div>`:`<input id="examInput" class="answer" value="${esc(examAnswers[idx]||'')}" inputmode="decimal" placeholder="Tu respuesta" oninput="examAnswers[${idx}]=this.value">`}<div style="margin-top:20px"><button class="btn" onclick="examNext()">${idx===17?'Finalizar y corregir':'Siguiente →'}</button>${idx>0?'<button class="btn secondary" onclick="examBack()">← Anterior</button>':''}<button class="btn secondary" onclick="home()">Salir al mapa</button></div></div>`}
function examChoose(el,v){examAnswers[idx]=v;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function examBack(){if(idx>0){idx--;showExam()}}
function examNext(){if(idx<17){idx++;showExam()}else finishExam()}
function finishExam(){let score=examSet.reduce((n,q,i)=>n+(normalize(examAnswers[i]||'')===normalize(q.a)?1:0),0);progress.exam=score;save();app.innerHTML=`<div class="panel"><h1>Resultado del simulacro</h1><div class="stat"><strong>${score}/18</strong>aciertos</div><p class="lead">Revisa tus respuestas y vuelve a practicar los contenidos que necesites.</p>${examSet.map((q,i)=>`<div class="feedback ${normalize(examAnswers[i]||'')===normalize(q.a)?'good':'bad'}"><strong>${i+1}. ${esc(q.q)}</strong>${diagram(q)}<div>Tu respuesta: ${esc(examAnswers[i]||'Sin responder')}</div><div>Correcta: ${esc(q.a)}</div><div>${esc(q.why)}</div></div>`).join('')}<button class="btn" onclick="home()">Volver al mapa</button><button class="btn secondary" onclick="startExam()">Nuevo simulacro</button></div>`}
home();
</script></body></html>
