name: Publicar Mundo 7 de Sociedad Contemporánea
on:
  push:
    branches: [main]
jobs:
  publicar:
    if: contains(github.event.head_commit.message, '[open-world7]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Abrir Mundo 7 y verificar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mision-sociedad-contemporanea.html')
          s=p.read_text(encoding='utf-8')
          start='<article aria-label="Mundo 7: Crisis, totalitarismos y Segunda Guerra Mundial, bloqueado" class="world locked" data-world-index="7">'
          assert s.count(start)==1, 'La tarjeta bloqueada del Mundo 7 no es única'
          i=s.index(start)
          j=s.index('</article>',i)+len('</article>')
          card=s[i:j]
          changes=[
          ('Mundial, bloqueado" class="world locked"','Mundial, disponible" class="world open"'),
          ('<span class="state">🔒 PRÓXIMAMENTE</span>','<span class="state">● DISPONIBLE</span>'),
          ('<span class="soon">Se desbloqueará en clase</span>','<button class="enter world-explore-button" id="enter-seventh" type="button" onclick="location.href=\'mundo-7-segunda-guerra-mundial.html\'">Explorar este mundo ↗</button>')
          ]
          for old,new in changes:
              assert card.count(old)==1, 'No se encuentra una marca esperada del Mundo 7: '+old
              card=card.replace(old,new)
          s=s[:i]+card+s[j:]
          assert s.count('6 mundos disponibles · 2 por descubrir')==1
          s=s.replace('6 mundos disponibles · 2 por descubrir','7 mundos disponibles · 1 por descubrir',1)
          assert '<article aria-label="Mundo 8: Guerra Fría y mundo actual, bloqueado" class="world locked"' in s
          assert 'id="enter-seventh"' in s
          p.write_text(s,encoding='utf-8')
          b=Path('mundo.html')
          t=b.read_text(encoding='utf-8')
          updates=[
          ('Seis primeros mundos disponibles; los demás se abrirán progresivamente.','Siete primeros mundos disponibles; el último se abrirá próximamente.'),
          ('la Primera Guerra Mundial y la Revolución rusa; los demás bloques se abrirán progresivamente.','la Primera Guerra Mundial, la Revolución rusa y la Segunda Guerra Mundial; el último bloque se abrirá próximamente.'),
          ('Seis primeros mundos abiertos','Siete primeros mundos abiertos')
          ]
          for old,new in updates:
              assert t.count(old)==1, 'Texto de biblioteca inesperado: '+old
              t=t.replace(old,new)
          b.write_text(t,encoding='utf-8')
          print('Publicación del Mundo 7 validada; Mundo 8 permanece cerrado')
          PY
      - name: Guardar cambios y retirar automatización temporal
        shell: bash
        run: |
          git rm .github/workflows/publicar-mundo-7.yml
          git add mision-sociedad-contemporanea.html mundo.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Abrir Mundo 7 y actualizar biblioteca; conservar Mundo 8 cerrado"
          git push
