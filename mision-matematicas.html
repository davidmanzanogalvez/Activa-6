'use strict';

const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=rnd(0,i);[b[i],b[j]]=[b[j],b[i]]}return b};
const fmt=n=>new Intl.NumberFormat('es-ES',{maximumFractionDigits:6}).format(n);
function eqAnswer(a,b){const norm=v=>String(v??'').trim().toLowerCase().replace(/\s/g,'').replace(/−/g,'-').replace(/,/g,'.');const x=norm(a),y=norm(b);if(!x)return false;if(/^[-+]?\d+(\.\d+)?$/.test(x)&&/^[-+]?\d+(\.\d+)?$/.test(y))return Math.abs(Number(x)-Number(y))<1e-8;return x===y}
const N=(topic,prompt,answer,explain,hint,unit='',visual='')=>({topic,type:'number',prompt,answer:String(answer),explain,hint,unit,visual});
const C=(topic,prompt,answer,opts,explain,hint,visual='')=>({topic,type:'choice',prompt,answer:String(answer),options:opts.map(String),explain,hint,visual});
function figure(kind){if(kind==='congruent')return `<svg viewBox="0 0 420 146" role="img" aria-label="Dos triángulos idénticos y uno de mayor tamaño"><g fill="#63b4d7" fill-opacity=".3" stroke="#9ce8ff" stroke-width="3"><path d="M25 115 L75 25 L125 115 Z"/><path d="M170 115 L220 25 L270 115 Z"/><path d="M316 118 L350 54 L385 118 Z"/></g><g fill="white" font-size="16" font-weight="bold"><text x="68" y="137">A</text><text x="214" y="137">B</text><text x="345" y="137">C</text></g></svg>`;if(kind==='similar')return `<svg viewBox="0 0 420 150" role="img" aria-label="Rectángulo A de 3 por 2, B de 6 por 4 y C de 6 por 3"><g stroke="#a6e6fe" stroke-width="3" fill="#3898a5" fill-opacity=".25"><rect x="14" y="20" width="84" height="56"/><rect x="145" y="20" width="168" height="112"/><rect x="326" y="20" width="84" height="42"/></g><g fill="#fff" font-size="16"><text x="43" y="111">A</text><text x="210" y="147">B</text><text x="363" y="91">C</text></g></svg>`;return ''}
const banks={
 numeros:[
 C('Valor posicional','En 374.629, ¿cuánto vale la cifra 7?','70.000',['7.000','70.000','700','700.000'],'El 7 está en las decenas de millar: vale 70.000.','Cuenta posiciones de derecha a izquierda: unidades, decenas, centenas, millares…'),
 C('Valor posicional','En 6.308.452, ¿qué cifra ocupa las centenas de millar?','3',['6','3','8','4'],'El 3 representa 300.000.','Seis millones y trescientos ocho mil.'),
 C('Decimales','En 58,407, ¿qué valor representa el 4?','4 décimas',['4 unidades','4 décimas','4 centésimas','4 milésimas'],'El primer lugar después de la coma es la décima.','Décimas → centésimas → milésimas.'),
 C('Decimales','En el número 9,056, ¿qué cifra son las centésimas?','5',['0','5','6','9'],'9,056 tiene 0 décimas, 5 centésimas y 6 milésimas.','Busca la segunda cifra a la derecha de la coma.'),
 N('Descomposición','¿Qué número es 4.000 + 300 + 20 + 6?','4326','4.326 = 4.000 + 300 + 20 + 6.','Suma millares, centenas, decenas y unidades.'),
 N('Descomposición','Forma el número: 8 unidades, 5 décimas y 3 centésimas.','8.53','8,53 = 8 + 0,5 + 0,03.','Escríbelo con coma o punto decimal.'),
 C('Comparación','¿Cuál de estos números es MAYOR?','6,4',['6,35','6,305','6,4','6,299'],'6,4 es el mayor porque equivale a 6,400.','Añade ceros a la derecha hasta tener igual número de decimales.'),
 C('Redondeo','Redondea 47.586 a la centena más próxima.','47.600',['47.500','47.600','48.000','47.590'],'La cifra de las decenas es 8; la centena sube de 5 a 6.','Mira la cifra inmediatamente a la derecha de la centena.'),
 C('Redondeo','Redondea 8,476 a las centésimas.','8,48',['8,47','8,48','8,5','8,476'],'La milésima es 6; la centésima pasa de 7 a 8.','Conserva dos cifras decimales y observa la tercera.'),
 C('Números negativos','¿Qué temperatura es más baja?','−8 °C',['−3 °C','0 °C','−8 °C','5 °C'],'En la recta numérica, −8 está más a la izquierda.','Con negativos, cuanto mayor es el valor absoluto, menor es el número.'),
 N('Números negativos','El termómetro marca −4 °C y sube 9 °C. ¿Cuántos grados marca ahora?','5','−4 + 9 = 5 °C.','Puedes avanzar nueve posiciones desde −4.','°C'),
 N('Números negativos','Una planta está en la planta −3 y sube 7 plantas. ¿En qué planta termina?','4','−3 + 7 = 4.','Empieza en −3 y avanza siete plantas.'),
 C('Valor posicional','¿Cuál es la descomposición correcta de 12,304?','10 + 2 + 0,3 + 0,004',['10 + 2 + 0,3 + 0,004','10 + 2 + 0,03 + 0,04','12 + 0,34','12 + 0,0304'],'El 3 vale tres décimas y el 4 cuatro milésimas.','Identifica el valor de cada cifra decimal.'),
 C('Redondeo','Al redondear 69.950 a los millares, obtenemos…','70.000',['69.000','69.900','70.000','69.000,5'],'Las centenas son 9, así que se aproxima a 70.000.','Mira la cifra de las centenas.'),
 C('Comparación','¿Qué orden es correcto, de menor a mayor?','−6, −2, 0, 3',['−2, −6, 0, 3','−6, −2, 0, 3','0, −2, 3, −6','3, 0, −2, −6'],'−6 < −2 < 0 < 3.','Imagina los números situados sobre una recta.'),
 ],

 N('Resta','Calcula: 70.004 − 28.576','41428','70.004 − 28.576 = 41.428.','Pon atención a los ceros y a las llevadas.'),

 N('División','Calcula: 8.736 ÷ 24','364','24 × 364 = 8.736; la división es exacta.','Prueba 24 × 300 y completa el resto.'),
 N('División','Calcula: 6.825 ÷ 35','195','35 × 195 = 6.825.','Puedes comprobar el resultado multiplicando.'),
 N('División','Al dividir 5.628 entre 17, ¿cuál es el COCIENTE entero?','331','17 × 331 = 5.627; el resto es 1.','Recuerda: dividendo = divisor × cociente + resto.'),
 N('División','Al dividir 5.628 entre 17, ¿cuál es el RESTO?','1','5.628 = 17 × 331 + 1.','El resto es menor que el divisor.'),
 N('Por 10, 100, 1.000','46 × 1.000 = …','46000','Multiplicar 46 por 1.000 equivale a 46.000.','Añade tres ceros a un número natural.'),
 N('Por 10, 100, 1.000','207 × 300 = …','62100','207 × 3 × 100 = 621 × 100 = 62.100.','Multiplica por 3 y después por 100.'),

 N('Potencias','Calcula: 3⁴','81','3⁴ = 3 × 3 × 3 × 3 = 81.','La base se multiplica por sí misma cuatro veces.'),
 N('Potencias','Calcula: 2⁶','64','2⁶ = 2 × 2 × 2 × 2 × 2 × 2 = 64.','Es el producto de seis doses.'),
 C('Potencias','¿Cómo se escribe 5 × 5 × 5 usando potencias?','5³',['3⁵','5³','5 × 3','15³'],'Base 5, exponente 3: tres factores iguales a 5.','Base = número repetido; exponente = número de factores.'),
 N('Potencias','Calcula: 10³ + 4²','1016','10³ = 1.000 y 4² = 16; total 1.016.','Resuelve primero cada potencia.'),
 N('División','Calcula: 9.408 ÷ 28','336','28 × 336 = 9.408.','Puedes partir 336 en 300 + 36.'),
 ],
 medidas:[
 N('Longitud','¿Cuántos centímetros hay en 3,5 metros?','350','3,5 m × 100 = 350 cm.','De metros a centímetros se multiplica por 100.','cm'),
 N('Longitud','¿Cuántos metros son 4.200 milímetros?','4.2','4.200 mm ÷ 1.000 = 4,2 m.','De milímetros a metros divide entre 1.000.','m'),
 N('Longitud','¿Cuántos metros hay en 2 km y 35 m?','2035','2 km = 2.000 m; más 35 m = 2.035 m.','Convierte primero los kilómetros.','m'),
 N('Masa','¿Cuántos gramos son 3,25 kg?','3250','3,25 kg = 3.250 g.','1 kg = 1.000 g.','g'),
 N('Masa','Una bolsa contiene 750 g. ¿Cuántos gramos hay en 4 bolsas?','3000','750 × 4 = 3.000 g.','Multiplica la masa de una bolsa por cuatro.','g'),
 N('Capacidad','¿Cuántos mililitros son 2,75 litros?','2750','2,75 l = 2.750 ml.','1 l = 1.000 ml.','ml'),
 N('Capacidad','¿Cuántos litros son 4.500 mililitros?','4.5','4.500 ml ÷ 1.000 = 4,5 l.','De ml a l, divide entre mil.','l'),

 C('Congruencia','¿Qué figuras son congruentes?','A y B',['A y B','A y C','B y C','Las tres'],'A y B tienen la misma forma y el mismo tamaño.','Congruentes = exactamente igual forma y tamaño.',figure('congruent')),

n al iniciar un nuevo recorrido. Puede proyectarse, utilizarse en ordenadores y enviarse a las familias como un único archivo .html. Las respuestas correctas se contabilizan si se acierta al primer intento; después se ofrecen pistas y la solución.</p></details></div>`;activateLinks()}
function activateLinks(){document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.open)));document.querySelectorAll('[data-view="expert"]').forEach(b=>b.addEventListener('click',renderExpertMenu));document.querySelectorAll('[data-expert]').forEach(b=>b.addEventListener('click',()=>startExpert(b.dataset.expert)))}
function makeSimulacro(){// Proporción equilibrada por bloques: 5+5+4+4 = 18.

function start(id){const m=modules.find(x=>x.id===id);const simulation=id==='simulacro';if(!simulation&&!m)return;current={kind:'questions',id,title:simulation?'Simulacro del examen':m.title,desc:simulation?'18 cuestiones que mezclan todos los contenidos. Puedes rectificar, pero solo el primer intento suma puntos.':m.desc,questions:simulation?makeSimulacro():shuffle(banks[id]),idx:0,first:0,mistakes:[],attempts:0,selected:null,finished:false,locked:false};renderQuestion();window.scrollTo(0,0)}
function activityShell(title,desc,inner,expertMode=false){return `<div class="activity"><button class="btn quiet back" id="backActivity">← ${expertMode?'Volver a los retos':'Volver al inicio'}</button><section class="panel ${expertMode?'expert-head':''}"><div class="activity-heading"><div><div class="kicker">${expertMode?'★ NIVEL EXPERTO · '+esc(current?.icon||'MISIÓN'):current?.id==='simulacro'?'SIMULACRO GENERAL':'ENTRENAMIENTO INTERACTIVO'}</div><h2>${esc(title)}</h2><p class="desc">${esc(desc)}</p></div><span class="chip">${expertMode?'Razonamiento avanzado':'6.º de Primaria'}</span></div>${inner}</section></div>`}
function renderQuestion(){let s=current;if(!s||s.kind!=='questions')return;if(s.idx>=s.questions.length){finishQuestions();return}let q=s.questions[s.idx];let pct=Math.round(100*s.idx/s.questions.length);let inside=`<div class="progress" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div style="width:${pct}%"></div></div><div class="question"><div class="qno">PREGUNTA ${s.idx+1} DE ${s.questions.length} · ${esc(q.topic.toUpperCase())}</div><p class="prompt">${esc(q.prompt)}</p>${q.visual?`<div class="diagram">${q.visual}</div>`:''}<div id="answerArea">${answerMarkup(q)}</div><div id="feedbackArea" aria-live="polite"></div></div><div class="actions"><span class="small">Aciertos al primer intento: <strong>${s.first}</strong></span><div class="right"><button class="btn quiet hidden" id="showSolution">Ver solución</button><button class="btn primary" id="checkAnswer">Comprobar</button><button class="btn primary hidden" id="nextQuestion">${s.idx===s.questions.length-1?'Ver resultado':'Siguiente →'}</button></div></div>`;$('main').innerHTML=activityShell(s.title,s.desc,inside);$('backActivity').addEventListener('click',goHome);wireAnswer(q,()=>checkCurrent());$('checkAnswer').addEventListener('click',checkCurrent);$('nextQuestion').addEventListener('click',()=>{s.idx++;s.attempts=0;s.selected=null;s.locked=false;renderQuestion()});$('showSolution').addEventListener('click',()=>showAnswer(false));}
function answerMarkup(q){if(q.type==='number')return `<label class="sr-only" for="numberAnswer">Tu respuesta</label><div class="entry"><input id="numberAnswer" type="text" inputmode="decimal" autocomplete="off" placeholder="Escribe tu respuesta" aria-label="Escribe tu respuesta">${q.unit?`<span class="unit">${esc(q.unit)}</span>`:''}</div><div class="hint">Puedes escribir los decimales con coma o punto; no hace falta poner la unidad.</div>`;return `<div class="options" role="group" aria-label="Elige la respuesta">${q.options.map((opt,i)=>`<button class="option" data-opt="${i}" aria-pressed="false">${String.fromCharCode(65+i)} · ${esc(opt)}</button>`).join('')}</div>`}
function wireAnswer(q,callback){if(q.type==='number'){$('numberAnswer')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();callback()}});$('numberAnswer')?.focus()}else document.querySelectorAll('[data-opt]').forEach(btn=>btn.addEventListener('click',()=>{if(current.locked)return;current.selected=q.options[Number(btn.dataset.opt)];document.querySelectorAll('[data-opt]').forEach(el=>{const yes=el===btn;el.classList.toggle('selected',yes);el.setAttribute('aria-pressed',String(yes))})}))}
function getResponse(q){return q.type==='number'?$('numberAnswer')?.value:current.selected}
function markAnswer(q,answer){return q.type==='number'?eqAnswer(answer,q.answer):String(answer)===q.answer}
function checkCurrent(){let s=current,q=s.questions[s.idx];if(s.locked)return;const v=getResponse(q);if(v===undefined||v===null||String(v).trim()===''){announce('Selecciona o escribe una respuesta antes de comprobar.','error');return}let ok=markAnswer(q,v);s.attempts++;if(ok){if(s.attempts===1)s.first++;else s.mistakes.push({q:q.prompt,answer:q.answer,reason:q.explain});showAnswer(true)}else{if(s.attempts===1)s.mistakes.push({q:q.prompt,answer:q.answer,reason:q.explain});announce((s.attempts===1?'Todavía no. Prueba otra vez. ':'Segundo intento: revisa la pista. ')+q.hint,'error');if(s.attempts>=2)$('showSolution').classList.remove('hidden')}}
function announce(msg,cls){$('feedbackArea').innerHTML=`<div class="feedback ${cls}" role="status"><strong>${cls==='success'?'¡Bien resuelto!':'Revisa tu respuesta'}</strong><p>${esc(msg)}</p></div>`}
function showAnswer(correct){let s=current,q=s.questions[s.idx];s.locked=true;announce((correct?'Respuesta correcta. ':'Respuesta: '+q.answer+'. ')+q.explain,'success');$('checkAnswer').classList.add('hidden');$('showSolution').classList.add('hidden');$('nextQuestion').classList.remove('hidden');document.querySelectorAll('.option').forEach(el=>el.disabled=true);const inp=$('numberAnswer');if(inp)inp.disabled=true}
function finishQuestions(){let s=current;s.finished=true;let total=s.questions.length,score=Math.round(s.first/total*100)/10;progress[s.id]={count:total,first:s.first,last:new Date().toISOString()};persist();let note=score>=9?'¡Dominio excelente!':score>=7?'¡Buen trabajo!':score>=5?'Vas progresando.':'Hay que seguir practicando.';let needs=s.mistakes.slice(0,5).map(x=>`<li><strong>${esc(x.q)}</strong><div>${esc(x.reason)}</div></li>`).join('');let inner=`<div class="finish"><div class="trophy">${score>=7?'🏅':'📘'}</div><h3>${note}</h3><div class="mark">${fmt(score)} / 10</div><p>Has acertado ${s.first} de ${total} preguntas al primer intento. Se valora aprender de los errores, pero la nota refleja únicamente la primera respuesta.</p><div class="confetti">✦ ✦ ✦</div></div>${needs?`<div class="intro-steps"><strong>Aspectos que conviene repasar:</strong><ol>${needs}</ol></div>`:`<p class="lead">¡Todas las preguntas correctas a la primera! Prueba la zona experta.</p>`}<div class="actions"><button class="btn" id="retry">↻ Repetir (nuevo orden)</button><div class="right"><button class="btn gold" id="toExpert">★ Retos expertos</button><button class="btn primary" id="toHome">Inicio</button></div></div>`;$('main').innerHTML=activityShell(s.title,'Resultado de la sesión',inner);$('backActivity').onclick=goHome;$('retry').onclick=()=>start(s.id);$('toExpert').onclick=renderExpertMenu;$('toHome').onclick=goHome;window.scrollTo(0,0)}
function renderExpertMenu(){current=null;$('main').innerHTML=`<div class="activity" style="max-width:1020px"><button class="btn quiet back" id="backActivity">← Volver al inicio</button><section class="panel expert-head"><div class="kicker">★ ZONA EXPERTA</div><h2>Misiones de alto voltaje</h2><p class="lead">Siete aventuras para pensar como un matemático: elegir qué hacer, conectar cálculos, revisar errores y comprobar resultados. Completa todos los pasos de cada reto para ganar su insignia.</p><div class="stats"><span class="stat"><b>${expertSolved()}/7</b>insignias obtenidas</span><span class="stat"><b>4</b>pasos como máximo por reto</span></div><div class="list-expert" style="margin-top:23px">${expert.map((r,i)=>`<button class="expert-choice" data-expert="${r.id}"><span class="symbol">${r.icon}</span><b>${i+1}. ${esc(r.title)} ${badges[r.id]?'✓':''}</b><small>${esc(r.desc)} · ${r.steps.length} pruebas</small></button>`).join('')}</div></section></div>`;$('backActivity').onclick=goHome;activateLinks();window.scrollTo(0,0)}
function startExpert(id){let r=expert.find(x=>x.id===id);if(!r)return;current={kind:'expert',id:r.id,icon:r.icon,title:r.title,desc:r.story,steps:r.steps,idx:0,attempts:0,selected:null,first:0,locked:false};renderExpertStep();window.scrollTo(0,0)}
function renderExpertStep(){let s=current;if(s.idx>=s.steps.length){finishExpert();return}let q=s.steps[s.idx],pct=Math.round(s.idx/s.steps.length*100);let steps=s.steps.map((_,i)=>`<span class="step-dot ${i<s.idx?'done':i===s.idx?'now':''}">${i<s.idx?'✓':i+1}</span>`).join('');let inside=`<div class="steps" aria-label="Etapas de la misión">${steps}</div><div class="progress" role="progressbar" aria-label="Progreso del reto" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div><div class="question"><div class="qno">${esc(q.topic.toUpperCase())} · ETAPA ${s.idx+1}/${s.steps.length}</div><p class="prompt">${esc(q.prompt)}</p>${q.visual?`<div class="diagram">${q.visual}</div>`:''}<div id="answerArea">${answerMarkup(q)}</div><div id="feedbackArea" aria-live="polite"></div></div><div class="actions"><span class="small">Etapas resueltas al primer intento: <b>${s.first}</b></span><div class="right"><button class="btn quiet hidden" id="showSolution">Ver solución</button><button class="btn gold" id="checkAnswer">Comprobar etapa</button><button class="btn gold hidden" id="nextQuestion">${s.idx===s.steps.length-1?'Conseguir insignia':'Abrir siguiente etapa →'}</button></div></div>`;$('main').innerHTML=activityShell(s.title,s.desc,inside,true);$('backActivity').onclick=renderExpertMenu;wireAnswer(q,checkExpert);$('checkAnswer').onclick=checkExpert;$('showSolution').onclick=()=>showExpert(false);$('nextQuestion').onclick=()=>{s.idx++;s.attempts=0;s.selected=null;s.locked=false;renderExpertStep()}}
function checkExpert(){let s=current,q=s.steps[s.idx];if(s.locked)return;let v=getResponse(q);if(v===undefined||v===null||String(v).trim()===''){announce('Primero debes responder.','error');return}let ok=markAnswer(q,v);s.attempts++;if(ok){if(s.attempts===1)s.first++;showExpert(true)}else{announce((s.attempts===1?'Casi. Analiza el problema. ':'Vuelve a revisar. ')+q.hint,'error');if(s.attempts>=2)$('showSolution').classList.remove('hidden')}}
function showExpert(ok){let s=current,q=s.steps[s.idx];s.locked=true;announce((ok?'¡Etapa superada! ':'Solución guiada: '+q.answer+'. ')+q.explain,'success');$('checkAnswer').classList.add('hidden');$('showSolution').classList.add('hidden');$('nextQuestion').classList.remove('hidden');document.querySelectorAll('.option').forEach(x=>x.disabled=true);if($('numberAnswer'))$('numberAnswer').disabled=true}
function finishExpert(){let s=current;badges[s.id]=true;persist();let inner=`<div class="finish"><div class="trophy">🏆</div><h3>¡Insignia conseguida!</h3><p>Has completado <strong>${esc(s.title)}</strong> y resuelto ${s.steps.length} etapas. Acertaste ${s.first} a la primera. Saber corregir un error también es aprender matemáticas.</p><div class="confetti">✦ ★ ✦ ★ ✦</div></div><div class="actions"><button class="btn" id="retry">Repetir desafío</button><div class="right"><button class="btn gold" id="more">Más retos expertos</button><button class="btn primary" id="toHome">Inicio</button></div></div>`;$('main').innerHTML=activityShell(s.title,'Desafío completado',inner,true);$('backActivity').onclick=renderExpertMenu;$('retry').onclick=()=>startExpert(s.id);$('more').onclick=renderExpertMenu;$('toHome').onclick=goHome;window.scrollTo(0,0)}
$('homeButton').addEventListener('click',goHome);
$('resetButton').addEventListener('click',()=>{if(window.confirm('¿Quieres borrar el progreso y las insignias de este navegador?')){progress={};badges={};persist();goHome()}});
renderHome();
</script>
</body>
</html>
